<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jabar 3 • Admin</title><style>body{margin:0;background:#f4f7f5;font:14px Segoe UI,Arial;color:#16231c}.box{width:min(560px,92vw);margin:8vh auto;background:#fff;border:1px solid #dfe8e3;border-radius:16px;padding:25px}h1{margin-top:0}label{display:block;font-size:12px;color:#6d7b74;margin:12px 0 5px}input{width:100%;padding:11px;border:1px solid #d9e3de;border-radius:8px;box-sizing:border-box}.btn{margin-top:14px;padding:11px 15px;border:0;border-radius:9px;background:#106044;color:#fff;cursor:pointer}.status{margin-top:12px;color:#6d7b74}.hidden{display:none}.ok{color:#106044}.err{color:#b33a3a}a{color:#106044}</style></head><body><div class="box"><h1>Admin Dashboard Jabar 3</h1><div id="login"><label>Username</label><input id="u" value="admin"><label>Password</label><input id="p" type="password"><button class="btn" onclick="login()">Login</button><div id="ls" class="status"></div></div><div id="panel" class="hidden"><p>Upload sumber data Excel ke server. Format: <b>.xlsx / .xls</b>.</p><input id="file" type="file" accept=".xlsx,.xls"><button class="btn" onclick="upload()">Upload & Proses</button><button class="btn" style="background:#fff;color:#106044;border:1px solid #dfe8e3;margin-left:6px" onclick="location.href='/'">Buka Dashboard</button><div id="us" class="status"></div></div></div><script>let token=localStorage.getItem('jabar3_token');function show(){if(token){$('login').classList.add('hidden');$('panel').classList.remove('hidden')}}const $=id=>document.getElementById(id);async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value,password:$('p').value})});let j=await r.json();if(!r.ok)return $('ls').textContent=j.error;$('ls').textContent='Login berhasil';token=j.token;localStorage.setItem('jabar3_token',token);show()}async function upload(){let f=$('file').files[0];if(!f)return $('us').textContent='Pilih file Excel.';let fd=new FormData();fd.append('file',f);$('us').textContent='Memproses...';let r=await fetch('/api/upload',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});let j=await r.json();if(r.status===401){localStorage.removeItem('jabar3_token');token='';show();return $('us').textContent='Sesi login berakhir.'}$('us').textContent=r.ok?'✓ '+j.meta.originalName+' berhasil dimuat. '+j.meta.rowCount+' baris tersedia.':j.error;$('us').className='status '+(r.ok?'ok':'err')}show();</script></body></html>

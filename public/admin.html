<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jabar 3 • Admin</title><style>:root{--g:#106044;--bg:#f4f7f5;--line:#dfe8e3;--muted:#6f7d76}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Segoe UI,Arial;color:#17231d}.box{width:min(950px,94vw);margin:6vh auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 14px 38px rgba(11,56,41,.10)}h1{margin:0 0 6px}.muted{color:var(--muted)}label{display:block;font-size:12px;color:var(--muted);margin:11px 0 5px}input{width:100%;padding:11px;border:1px solid #d8e3dd;border-radius:9px}.btn{padding:11px 15px;border:0;border-radius:9px;background:var(--g);color:#fff;cursor:pointer}.btn.secondary{background:#fff;color:var(--g);border:1px solid var(--line)}.hidden{display:none}.status{margin-top:10px;color:var(--muted)}.ok{color:var(--g)}.err{color:#b33a3a}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:18px}.card{border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 8px 20px rgba(11,56,41,.06)}.card h3{margin:0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><div class="box"><h1>Admin Dashboard Jabar 3</h1><p class="muted">Kelola 3 sumber Excel secara terpisah: Penyaluran, Stok, dan Realisasi Harian.</p><div id="login"><label>Username</label><input id="u" value="admin"><label>Password</label><input id="p" type="password"><button class="btn" onclick="login()">Login</button><div id="ls" class="status"></div></div><div id="panel" class="hidden"><div class="grid"><div class="card"><h3>Data Penyaluran</h3><p class="muted">Excel AAE, kecamatan, produk, alokasi & penyaluran.</p><input id="sales" type="file" accept=".xlsx,.xls"><div class="row"><button class="btn" onclick="upload('sales')">Upload Penyaluran</button></div><div id="ss" class="status"></div></div><div class="card"><h3>Data Stok</h3><p class="muted">Excel Kabupaten, Gudang Lini III, PPTS, PUD.</p><input id="stock" type="file" accept=".xlsx,.xls"><div class="row"><button class="btn" onclick="upload('stock')">Upload Stok</button></div><div id="ks" class="status"></div></div><div class="card"><h3>Realisasi Harian</h3><p class="muted">Excel dengan kolom TANGGAL dan REALISASI saja.</p><input id="daily" type="file" accept=".xlsx,.xls"><div class="row"><button class="btn" onclick="upload('daily')">Upload Realisasi Harian</button></div><div id="ds" class="status"></div></div></div><div class="row"><button class="btn secondary" onclick="location.href='/'">Buka Dashboard</button><button class="btn secondary" onclick="logout()">Keluar</button></div></div></div><script>const $=id=>document.getElementById(id);let token=localStorage.getItem('jabar3_token');function show(){if(token){$('login').classList.add('hidden');$('panel').classList.remove('hidden')}}async function login(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value,password:$('p').value})});const j=await r.json();if(!r.ok)return $('ls').textContent=j.error;token=j.token;localStorage.setItem('jabar3_token',token);$('ls').textContent='Login berhasil';show()}async function upload(kind){const input=$(kind),status=$(kind==='sales'?'ss':kind==='stock'?'ks':'ds'),f=input.files[0];if(!f){status.textContent='Pilih file Excel.';return}const fd=new FormData();fd.append('file',f);status.textContent='Memproses...';const r=await fetch('/api/upload/'+kind,{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});const j=await r.json();if(r.status===401){logout();return}status.textContent=r.ok?'✓ '+j.meta.originalName+' • '+j.meta.rowCount+' baris tersimpan.':j.error;status.className='status '+(r.ok?'ok':'err')}function logout(){localStorage.removeItem('jabar3_token');location.reload()}show();</script></body></html>

<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jabar 3 • Admin</title><style>:root{--g:#106048;--soft:#e7f3ed;--bg:#f6f7f6;--line:#e3e9e5}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Segoe UI,Arial;color:#17211d}.wrap{width:min(760px,92vw);margin:7vh auto}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900;margin-bottom:15px}.mark{width:35px;height:35px;border:3px solid var(--g);border-radius:12px;display:grid;place-items:center;color:var(--g)}.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 14px 35px rgba(20,40,30,.06)}h1{margin:0 0 6px;font-size:27px}.muted{color:#718078}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{display:block;font-size:11px;color:#718078;margin:14px 0 5px}input{width:100%;padding:12px;border:1px solid #d8e2dd;border-radius:10px}.btn{margin-top:15px;padding:11px 15px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer}.primary{background:var(--g);border-color:var(--g);color:#fff}.status{margin-top:12px;color:#718078}.ok{color:var(--g)}.err{color:#b33a3a}.hidden{display:none}.info{background:var(--soft);border-radius:12px;padding:13px;margin:14px 0;font-size:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="brand"><div class="mark">✦</div><div>JABAR 3<small style="display:block;color:#718078;font-size:10px;font-weight:600">ADMIN PANEL</small></div></div><div class="box"><div id="login"><h1>Admin Dashboard</h1><div class="muted">Login untuk memperbarui data Excel.</div><label>Username</label><input id="u" value="admin"><label>Password</label><input id="p" type="password"><button class="btn primary" onclick="login()">Login</button><div id="ls" class="status"></div></div><div id="panel" class="hidden"><h1>Update Data</h1><div class="muted">Upload sumber data Excel ke server.</div><div class="info"><b>Format:</b> .xlsx / .xls &nbsp; • &nbsp; Maks. 25 MB<br><b>Kolom wajib:</b> KABUPATEN, KECAMATAN, PRODUK, AAE, PUD, ALOKASI 1 TAHUN, TOTAL S</div><input id="file" type="file" accept=".xlsx,.xls"><button class="btn primary" onclick="upload()">Upload & Proses</button><button class="btn" onclick="location.href='/'">Buka Dashboard</button><div id="us" class="status"></div></div></div></div><script>let token=localStorage.getItem('jabar3_token');const $=id=>document.getElementById(id);function show(){if(token){$('login').classList.add('hidden');$('panel').classList.remove('hidden')}}async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value,password:$('p').value})}),j=await r.json();if(!r.ok)return $('ls').textContent=j.error;$('ls').textContent='Login berhasil';token=j.token;localStorage.setItem('jabar3_token',token);show()}async function upload(){let f=$('file').files[0];if(!f)return $('us').textContent='Pilih file Excel.';let fd=new FormData();fd.append('file',f);$('us').textContent='Memproses...';let r=await fetch('/api/upload',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd}),j=await r.json();if(r.status===401){localStorage.removeItem('jabar3_token');token='';show();return $('us').textContent='Sesi login berakhir.'}$('us').textContent=r.ok?'✓ '+j.meta.originalName+' berhasil dimuat. '+j.meta.rowCount+' baris tersedia.':j.error;$('us').className='status '+(r.ok?'ok':'err')}show();</script></body></html>
